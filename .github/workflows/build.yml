name: Build and check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned framework
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Verify DSP
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify update installation and host waiting
        run: ./tools/verify_updater.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent host test tools
        run: python -m pip install -r tools/requirements-verify.txt
      - name: Verify the compiled VST3
        run: python tools/verify_plugin.py --plugin "build/BatchlyAudio_artefacts/Release/VST3/Batchly Audio.vst3/Contents/x86_64-win/Batchly Audio.vst3" --output build/listening
      - uses: actions/upload-artifact@v4
        with:
          name: Batchly-Audio-Windows-preview
          path: |
            build/BatchlyAudio_artefacts/Release/Standalone/Batchly Audio.exe
            build/BatchlyAudio_artefacts/Release/VST3/Batchly Audio.vst3/
            LICENSE
            THIRD_PARTY_NOTICES.md
            third-party/
            README.md
            docs/
            tools/install-vst3.ps1
